name: Render chunk Tacoma

# Render 1 chunk Tacoma penuh (300 frame, ~3-4 jam di CPU).
# Dipakai HANYA kalau bench 30 frame terbukti cukup cepat.
# Cara pakai: Actions tab -> Render chunk Tacoma -> Run workflow,
# isi chunk 0-7. Mapping frame sudah sesuai render_chunks.sh.
# 1 job = 1 chunk, maks 6 jam/job. Jangan jalankan chunk yang
# sudah selesai di InstaBox (0 dan 6 masih jalan di sana 2026-11-26 ~00:00 WIB).
on:
  workflow_dispatch:
    inputs:
      chunk:
        description: "Chunk 0-7 (0:0-299, 1:300-599, 2:600-899, 3:900-1199, 4:1200-1499, 5:1500-1799, 6:1800-2099, 7:2100-2249)"
        required: true
        default: "0"

jobs:
  render:
    name: Chunk ${{ inputs.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Map chunk to frames
        run: |
          case "${{ inputs.chunk }}" in
            0) echo "FRAMES=0-299" >> $GITHUB_ENV ;;
            1) echo "FRAMES=300-599" >> $GITHUB_ENV ;;
            2) echo "FRAMES=600-899" >> $GITHUB_ENV ;;
            3) echo "FRAMES=900-1199" >> $GITHUB_ENV ;;
            4) echo "FRAMES=1200-1499" >> $GITHUB_ENV ;;
            5) echo "FRAMES=1500-1799" >> $GITHUB_ENV ;;
            6) echo "FRAMES=1800-2099" >> $GITHUB_ENV ;;
            7) echo "FRAMES=2100-2249" >> $GITHUB_ENV ;;
            *) echo "Chunk harus 0-7"; exit 1 ;;
          esac

      - name: Render chunk
        run: |
          mkdir -p out
          npx remotion render TacomaShort "out/tacoma-part${{ inputs.chunk }}.mp4" \
            --frames="$FRAMES" \
            --concurrency=2 \
            --gl=angle \
            --props='{"post":{"lens":false,"bloom":false,"msaa":false,"shadows":false}}'

      - name: Verify output
        run: ls -lh out/ && ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "out/tacoma-part${{ inputs.chunk }}.mp4" || true

      # Artifact gratis cuma 500 MB, chunk ~15-20 MB jadi masih muat.
      # Kalau nanti pindah ke Release, ganti step ini.
      - uses: actions/upload-artifact@v4
        with:
          name: tacoma-part${{ inputs.chunk }}
          path: out/tacoma-part${{ inputs.chunk }}.mp4
          retention-days: 7
